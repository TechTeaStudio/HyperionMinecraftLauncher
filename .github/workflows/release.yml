name: Release

# Tag-driven release pipeline.
#
# Triggered ONLY by pushing a SemVer tag like `v0.32.1`. Branch pushes do
# nothing here - the CI matrix in dotnet.yml already covers per-commit build
# and test on `product`. This workflow is reserved for producing user-facing
# artifacts (Windows .zip, Linux .AppImage, macOS .app.zip) and, optionally,
# attaching them to a GitHub Release.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-universal
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore HyperionMinecraftLauncher.slnx

      - name: Test
        run: dotnet test HyperionMinecraftLauncher.slnx -c Release

      # Linux: AppImage via the existing script in scripts/build-appimage.sh.
      - name: Package (Linux AppImage)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          # appimagetool is optional - if it's not on PATH the script leaves the
          # AppDir unpacked and exits 0. We try to install it so the artifact is
          # an actual .AppImage; if the install fails we still upload the AppDir.
          if ! command -v appimagetool >/dev/null 2>&1; then
            curl -sSL -o /tmp/appimagetool \
              "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
            chmod +x /tmp/appimagetool
            sudo mv /tmp/appimagetool /usr/local/bin/appimagetool
          fi
          bash scripts/build-appimage.sh

      - name: Stage Linux artifact
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # Prefer the packed .AppImage if present, fall back to a tar of the AppDir.
          if compgen -G "publish/*.AppImage" > /dev/null; then
            cp publish/*.AppImage "artifacts/hyperion-linux-x64-${GITHUB_REF_NAME}.AppImage"
          else
            tar -C publish -czf "artifacts/hyperion-linux-x64-${GITHUB_REF_NAME}.AppDir.tar.gz" HyperionMinecraftLauncher.AppDir
          fi

      # Windows: self-contained single-file publish then zip. The
      # IncludeNativeLibrariesForSelfExtract flag bundles Avalonia's native sidecars
      # (libSkiaSharp, libHarfBuzzSharp, av_libglesv2, ...) INSIDE the single .exe
      # so the resulting zip is one file: HyperionMinecraftLauncher.exe. First launch
      # self-extracts the natives to %TEMP%\.net\<app>\<hash>\ and caches them there.
      # Matches the local scripts/build-release.ps1 flags so the CI artefact and the
      # `build.cmd` developer output are the same shape.
      - name: Package (Windows zip)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          dotnet publish src/HyperionMinecraftLauncher.App `
            -r win-x64 `
            -c Release `
            --self-contained `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish/win-x64
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $zip = "artifacts/hyperion-win-x64-$env:GITHUB_REF_NAME.zip"
          Compress-Archive -Path publish/win-x64/* -DestinationPath $zip -Force

      # macOS: build Intel + Apple Silicon .app bundles via the shipped
      # scripts/build-macos-app.sh in one pass (the script publishes both RIDs and
      # produces proper Info.plist + AppIcon.icns + Resources/Localization), then
      # wrap each .app in a Gatekeeper-friendly ZIP and run build-macos-dmg.sh
      # for the drag-to-install .dmg artifacts.
      #
      # Earlier this step zipped `publish/osx-arm64/` (the raw self-contained
      # publish tree) which has no Info.plist - Finder refused to treat the ZIP
      # as a real .app. The fix is to zip the assembled bundle directories that
      # build-macos-app.sh creates next to the publish output:
      #   publish/HyperionMinecraftLauncher-x86_64.app/
      #   publish/HyperionMinecraftLauncher-arm64.app/
      - name: Package (macOS .app + .dmg, Intel + Apple Silicon)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-macos-app.sh
          bash scripts/build-macos-dmg.sh
          mkdir -p artifacts

          # ZIP each .app bundle. `zip -y` preserves symlinks; .app bundles
          # don't currently contain any but this keeps us future-proof if a
          # later signing pass introduces Frameworks/ with symlinked versions.
          for arch in x86_64 arm64; do
            app_dir="publish/HyperionMinecraftLauncher-${arch}.app"
            if [ -d "${app_dir}" ]; then
              (cd publish && zip -ry \
                "../artifacts/hyperion-macos-${arch}-${GITHUB_REF_NAME}.app.zip" \
                "HyperionMinecraftLauncher-${arch}.app")
            else
              echo "::warning::Expected ${app_dir} from build-macos-app.sh, but it was not produced."
            fi
          done

          # .dmg files are already UDZO-compressed - copy as-is. The DMG
          # filenames include the version (build-macos-dmg.sh:38) so the
          # GITHUB_REF_NAME tag is implicit in the name.
          shopt -s nullglob
          for dmg in publish/HyperionMinecraftLauncher-*-x86_64.dmg publish/HyperionMinecraftLauncher-*-arm64.dmg; do
            cp "${dmg}" artifacts/
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyperion-${{ matrix.rid }}-${{ github.ref_name }}
          path: artifacts/*
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          # Pick up every shippable archive format: Windows .zip, Linux .AppImage,
          # macOS .app.zip + .dmg (added in v0.32.12), and the rare AppDir tarball
          # fallback. The find glob omitting *.dmg would silently drop macOS
          # installers from the GitHub Release page even though they're uploaded
          # as workflow artefacts.
          find dist -type f \( -name '*.zip' -o -name '*.AppImage' -o -name '*.tar.gz' -o -name '*.dmg' \) -print -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: release-assets/*
          fail_on_unmatched_files: false
