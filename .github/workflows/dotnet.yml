name: .NET

on:
  push:
    branches: ["product"]
  pull_request:
    branches: ["product"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore HyperionMinecraftLauncher.slnx

      - name: Build
        run: dotnet build HyperionMinecraftLauncher.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test HyperionMinecraftLauncher.slnx --no-build --configuration Release --verbosity normal
